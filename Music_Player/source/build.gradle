plugins { id 'fabric-loom' version '1.7.4'; id 'maven-publish' }
version = '0.2.0'
group = 'dev.krys'
loom { mixin { defaultRefmapName = 'blockradio-refmap.json' } }
base { archivesName = 'blockradio' }
repositories { mavenCentral() }
dependencies {
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.19.3'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }

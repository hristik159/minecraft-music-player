name: BlockRadio Windows package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Install backend build dependencies
        run: python -m pip install -r Music_Player/bridge/requirements.txt pyinstaller==6.11.1 psutil==6.1.1
      - name: Python regression tests
        run: python -m unittest discover -s Music_Player/bridge -v
      - name: Package standalone GUI-subsystem backend
        working-directory: Music_Player/bridge
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name blockradio-backend --collect-all imageio_ffmpeg --collect-all keyring --hidden-import keyring.backends.Windows --add-data "youtube_player.html;." managed_backend.py
      - name: Smoke-test packaged Windows executable
        working-directory: Music_Player/bridge
        run: python smoke_windows.py
      - name: Build Fabric JAR with bundled backend
        working-directory: Music_Player/source
        run: ./gradlew.bat build --no-daemon
      - name: Verify embedded EXE
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          jar = Path('Music_Player/source/build/libs/blockradio-0.4.0.jar')
          with zipfile.ZipFile(jar) as z:
              assert z.read('backend/blockradio-backend.exe')[:2] == b'MZ'
      - name: Clean-install test from release JAR without Python on PATH
        working-directory: Music_Player/bridge
        run: python smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: BlockRadio-0.4.0-Windows
          path: |
            Music_Player/source/build/libs/blockradio-0.4.0.jar
            Music_Player/bridge/dist/blockradio-backend.exe
          if-no-files-found: error
